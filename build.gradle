// TLM MiMo TTS 附属 Mod（Forge 1.20.1）
// 本文件为 forge-1.20.1 分支专用；main 分支为 NeoForge 1.21.1（ModDevGradle）
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.aliyun.com/repository/public/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0.16,6.2)', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'

// jar 文件名后缀区分双分支：forge-1.20.1 分支（main 分支为 NeoForge 1.21.1）
version = "${mod_version}-forge-1.20.1"
group = mod_group_id
base { archivesName = 'tlm-mimo-tts' }

// 需要 Java 17 版本
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: '2023.08.20-1.20.1'
    runs {
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            property 'forge.logging.markers', 'REGISTRIES'
            mods { tlm_mimo_tts { source sourceSets.main } }
        }
        client {
            workingDirectory project.file('run/client')
            args '--username', 'xm2nd'
        }
        server {
            workingDirectory project.file('run/server')
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "tlm_mimo_tts.refmap.json"
    config "tlm_mimo_tts.mixins.json"
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // 必须 fg.deobf：Modrinth 1.20.1 发布物是 SRG 名，不 deobf 编译不过。
    // 发布 JAR 不打包 TLM，而是在 mods.toml 中声明其为双端必需前置。
    implementation fg.deobf('maven.modrinth:touhou-little-maid:1.5.3-forge+mc1.20.1')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// selftest 自检源码集引用 MC/TLM 类（CompoundTag、TTSConfig 等），
// 让 test 源码集继承 main 的完整类路径
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

// 用于 mods.toml 里替换那一堆 ${xxxx}
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

// 必须，编码需要显式指定为 UTF
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 防 refmap 偶发丢失（TLM 同款）
tasks.compileJava {
    outputs.upToDateWhen { false }
}

// 自检：无第三方测试依赖，纯 JDK 标准库（由每个 SelfTest 类的 main 方法驱动）
tasks.register('selftest', JavaExec) {
    group = 'verification'
    description = '运行无第三方依赖的自检测试（文件仓库 / HTTP Mock / WAV 解码）'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.xm2nd.tlmmimotts.selftest.RunAllSelfTests'
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'stdout.encoding', 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : 'tlm-mimo-tts',
                'Specification-Version' : mod_version,
                'Implementation-Title'  : 'TLM MiMo TTS',
                'Implementation-Version': mod_version,
                'MixinConfigs'          : "${mod_id}.mixins.json"
        ])
    }
}

java {
    withSourcesJar()
}
